name: Mirror Release (GitHub to GitCode)

# GitCode 托管 Runner 只有 Linux（Ubuntu 24.04 / openEuler），无法本地构建
# Windows 发布包（PyInstaller + NSIS + MinGW）。因此本流水线不重建，而是把
# GitHub Actions 产出的同款资产（Sopeek-<版本>-windows-<架构>.exe 与
# SHA256SUMS.txt）镜像到 GitCode 的同名 Release，保证两边发行资产完全一致：
#   - nightly：每天覆盖更新（预发布，只保留最新一份，与 GitHub 语义一致）；
#   - 正式版：仅当 GitCode 上不存在该 tag 时补建，绝不静默覆盖。
#
# 前置条件（重要）：
#   1. GitCode 仓库默认分支必须是 main-v2（schedule 只在默认分支生效）；
#   2. 在仓库设置中配置 Secret GITCODE_TOKEN（需仓库写权限）；留空时回退使用
#      流水线自带的 ATOMGIT_TOKEN；
#   3. 可选配置 GH_TOKEN 以提高 GitHub API 的限流额度（匿名每小时 60 次）。
#
# 触发：每天 UTC 20:30（北京时间次日 04:30，给 GitHub 的 UTC 18:00 夜间构建
# 预留 2.5 小时），也可在「流水线」页手动触发并指定通道与 tag。

on:
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: '同步通道：auto=nightly + 最新正式版；nightly；stable；all=补齐全部历史版本'
        required: false
        default: auto
        type: choice
        options:
          - auto
          - nightly
          - stable
          - all
      tag:
        description: '可选：指定 GitHub Release tag（留空按通道自动解析）'
        required: false
        type: string

jobs:
  mirror:
    name: Mirror GitHub release assets
    runs-on: [ubuntu-latest, x64, small]
    timeout-minutes: 60

    steps:
      - name: Checkout main-v2
        uses: checkout

      - name: Mirror release to GitCode
        env:
          CHANNEL: ${{ inputs.channel }}
          TAG_INPUT: ${{ inputs.tag }}
          GH_REPO: Dorufoc/FreeAssetFilter
          GITCODE_REPO: Dorufoc/FreeAssetFilter
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          python3 tools/mirror_release_to_gitcode.py \
            --channel "${CHANNEL:-auto}" \
            --tag "${TAG_INPUT:-}"
