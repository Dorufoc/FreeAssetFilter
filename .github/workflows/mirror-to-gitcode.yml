name: Mirror Release to GitCode

# 把 GitHub Release 的发布资产（安装包 + SHA256SUMS.txt）镜像到 GitCode 的同名 Release。
#
# 为什么由 GitHub 侧执行：GitCode 的流水线（Actions）目前只在 API 层可用，
# 网页端没有「流水线 / 密钥与变量」入口，无法配置写权限令牌；因此改为在
# GitHub Actions 里用 Secret GITCODE_TOKEN 调用 GitCode API。
#
# 触发：
#   - release: published —— 任何 Release 发布（含 nightly 覆盖重建）后自动镜像；
#   - workflow_dispatch —— 手动补镜像（channel=auto/nightly/stable/all，可指定 tag）。
#
# 前置条件：仓库 Secret GITCODE_TOKEN = GitCode 个人访问令牌（需 Release 写权限）。
# 未配置时自动跳过，不会让发布流程失败。

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      channel:
        description: '同步通道：auto=nightly + 最新正式版；nightly；stable；all=补齐全部历史版本'
        required: false
        default: auto
        type: choice
        options:
          - auto
          - nightly
          - stable
          - all
      tag:
        description: '可选：指定 GitHub Release tag（留空按通道自动解析）'
        required: false
        type: string

concurrency:
  group: mirror-to-gitcode
  cancel-in-progress: false

# 最小权限：本工作流只读仓库内容，写操作全部走 GITCODE_TOKEN。
permissions:
  contents: read

jobs:
  mirror:
    name: Mirror release assets
    runs-on: ubuntu-latest
    # GitHub 美国节点到 GitCode/Huawei OBS 的上行实测约 60KB/s，
    # 156MB 安装包需要 40~60 分钟，故放宽到 120 分钟。
    timeout-minutes: 120

    steps:
      - name: Checkout main-v2
        uses: actions/checkout@v4
        with:
          ref: main-v2

      - name: Mirror release to GitCode
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          CHANNEL: ${{ inputs.channel }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${GITCODE_TOKEN}" ]; then
            echo "GITCODE_TOKEN 未配置，跳过 GitCode 镜像。"
            exit 0
          fi
          if [ -n "${EVENT_TAG}" ]; then
            # Release 事件：只镜像刚发布的那一个 tag（nightly 会覆盖重建）。
            python3 tools/mirror_release_to_gitcode.py --tag "${EVENT_TAG}"
          else
            python3 tools/mirror_release_to_gitcode.py \
              --channel "${CHANNEL:-auto}" \
              --tag "${TAG_INPUT:-}"
          fi
