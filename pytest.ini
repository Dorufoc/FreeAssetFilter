[pytest]
markers =
    unit: Unit tests for individual modules
    widgets: Custom QWidget tests
    components: UI component tests
    integration: Cross-component flow tests
    gui: Visual tests requiring a real display
    benchmark: Performance benchmark tests
    visual: Visual regression tests
    slow: Slow tests requiring extended timeout
    mpv: Tests depending on libmpv-2.dll
    office: Office document tests
    com: COM interop tests
    rust: Rust native extension tests
timeout=30
timeout_method = thread
addopts = -p no:cacheprovider --tb=short -m "not gui" --strict-markers
norecursedirs = CVS _darcs {arch} *.egg .venv .tox
testpaths = tests